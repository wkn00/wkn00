apiVersion: apps/v1
kind: Deployment
metadata:
  name: wael-frontend
  namespace: wael
  labels:
    app: wael-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wael-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wael-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      affinity:
        # Keep the control plane (wk) free: land on the workers whenever
        # they can take the pod, but stay schedulable if they cannot.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["wk1", "wk2"]
        # One replica per node, so a single worker going down never takes
        # the whole site with it.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: wael-frontend
      containers:
        - name: nginx
          image: ghcr.io/wkn00/wael-portfolio:1.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
        # Emails the CV to visitors who ask for it (nginx proxies /api/ here).
        # Both Secrets are optional so the site still starts without them;
        # until they exist the endpoint answers 503. Created by hand, never
        # from this directory:
        #   kubectl -n wael create secret generic cv-mailer-smtp \
        #     --from-literal=GMAIL_USER=kattan.wa@gmail.com \
        #     --from-literal=GMAIL_APP_PASSWORD='xxxx xxxx xxxx xxxx'
        #   kubectl -n wael create secret generic cv-pdf \
        #     --from-file=Wael_Kattan_CV.pdf=<web copy without references>
        - name: cv-mailer
          image: ghcr.io/wkn00/wael-cv-mailer:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef: { name: cv-mailer-smtp, key: GMAIL_USER, optional: true }
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: cv-mailer-smtp, key: GMAIL_APP_PASSWORD, optional: true }
          volumeMounts:
            - name: cv-pdf
              mountPath: /cv
              readOnly: true
          # Liveness only: a readiness probe here would pull the whole site
          # out of rotation whenever the mailer has trouble. It listens on
          # localhost, so the check runs inside the container.
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:8080/api/health"]
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # "node" in node:alpine; the kubelet needs it numeric
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: cv-pdf
          secret:
            secretName: cv-pdf
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: wael-frontend
  namespace: wael
  labels:
    app: wael-frontend
spec:
  selector:
    app: wael-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
