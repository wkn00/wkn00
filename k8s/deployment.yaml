apiVersion: apps/v1
kind: Deployment
metadata:
  name: wael-frontend
  namespace: wael
  labels:
    app: wael-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wael-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wael-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: nginx
          image: ghcr.io/wkn00/wael-portfolio:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wael-frontend
  namespace: wael
  labels:
    app: wael-frontend
spec:
  selector:
    app: wael-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
